<!DOCTYPE html>
<html>
<head>
  <title>BrowseHere Smart Search</title>
  <meta name="description" content="BrowseHere Smart Search - Quickly search the web using Bing directly from your browser.">
  <meta name="keywords" content="search engine, browse, Bing, web search, BrowseHere, smart search">
  <meta name="author" content="Vishal K - appmakervishal.github.io">

  <!-- Open Graph / Social Preview -->
  <meta property="og:title" content="BrowseHere Smart Search">
  <meta property="og:description" content="Quickly search the web using Bing directly from your browser with BrowseHere.">
  <meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzLvnR8JeKesjy51G3-hTz8VKz3-n91ibtKw&s">
  <meta property="og:url" content="https://appmakervishal.github.io">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BrowseHere Smart Search">
  <meta name="twitter:description" content="Quickly search the web using Bing directly from your browser with BrowseHere.">
  <meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzLvnR8JeKesjy51G3-hTz8VKz3-n91ibtKw&s">
  <style>
    body { font-family: sans-serif; text-align: center; padding: 1rem; }
    input, select, button { padding: 0.5rem; margin: 0.3rem; }
    iframe { width: 100%; height: 80vh; border: none; margin-top: 1rem; }
  </style>
</head>
<body>
  <h2>BrowseHere</h2>
  <input id="query" type="text" placeholder="Enter search..." />
  <select id="engine">

    <option value="https://www.bing.com/search?q=">Bing</option>
    <option value="https://www.google.com/search?q=">Google</option>
   // Added Google as an option -BShark
    
  </select>
  <button onclick="search()">Search</button>

  <iframe id="browserFrame"></iframe>

<script>
  function search(query) {
    const engine = document.getElementById('engine').value;
    const fullUrl = engine + encodeURIComponent(query);
    document.getElementById('browserFrame').src = fullUrl;
  }

  // Listen to remote commands
  window.addEventListener("message", (event) => {
    if (event.data?.type === "search") {
      document.getElementById("query").value = event.data.query;
      search(event.data.query);
    }
  });
</script>
</body>
</html>
